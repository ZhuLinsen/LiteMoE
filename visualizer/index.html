<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>One LLM Inference, Step by Step</title>
<style>
/* Layout: control strip, one input-to-output flow, token stream, then three panels fed by one timeline. */
:root {
  --bg: #eef1f4; --panel: #fbfcfd; --ink: #18232e; --muted: #5b6875; --line: #d3dae1;
  --prefill: #0b72a8; --decode: #c2500f; --empty: #e4e9ee; --on-accent: #ffffff;
  --display: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --mono: "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #11171d; --panel: #18212a; --ink: #e6ebf0; --muted: #94a1ae; --line: #2c3845;
  --prefill: #3a9bd5; --decode: #de6b26; --empty: #232e39; --on-accent: #11171d; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #11171d; --panel: #18212a; --ink: #e6ebf0; --muted: #94a1ae; --line: #2c3845;
  --prefill: #3a9bd5; --decode: #de6b26; --empty: #232e39; --on-accent: #11171d; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.55 var(--display); padding: 20px 16px 32px; }
main { max-width: 1160px; margin: 0 auto; display: grid; gap: 14px; }
h1 { font-size: 24px; line-height: 1.25; margin: 0; text-wrap: balance; }
h2 { font-size: 15px; margin: 0; text-wrap: balance; }
p { margin: 0; }
a { color: inherit; }
.link { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border: 1px solid var(--line); border-radius: 4px; background: var(--panel); font-size: 14px; text-decoration: none; }
.link:hover { border-color: var(--ink); }
.muted { color: var(--muted); font-size: 13px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 14px; display: grid; gap: 10px; align-content: start; min-width: 0; }
.bar { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
.split { justify-content: space-between; }
header { display: grid; gap: 4px; }
header p { max-width: 72ch; }
button { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 5px 12px; cursor: pointer; }
button:hover:not(:disabled) { border-color: var(--ink); }
button:disabled { opacity: .45; cursor: default; }
button:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--decode); outline-offset: 1px; }
#play { background: var(--decode); border-color: var(--decode); color: var(--on-accent); font-weight: 700; min-width: 72px; }
#range { flex: 1 1 200px; min-width: 160px; accent-color: var(--decode); }
.phase { font-weight: 700; font-size: 13px; color: var(--on-accent); padding: 2px 10px; border-radius: 3px; }
.phase.p { background: var(--prefill); } .phase.d { background: var(--decode); }
#step { font-variant-numeric: tabular-nums; }
/* The one sentence a beginner needs: what went in, what came out. */
.flow { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr) auto minmax(0, 1fr); gap: 8px; align-items: stretch; }
.flow > div { border: 1px solid var(--line); border-radius: 4px; padding: 6px 10px; min-width: 0; }
.flow small { display: block; color: var(--muted); font-size: 12px; }
.flow b { font: 700 16px/1.4 var(--mono); overflow-wrap: anywhere; white-space: pre-wrap; }
.flow .arrow { border: 0; padding: 0; align-self: center; color: var(--muted); }
#fIn.p { color: var(--prefill); } #fOut { color: var(--decode); }
#explain { min-height: 46px; max-width: 80ch; }
.tokens { display: flex; flex-wrap: wrap; gap: 3px; font: 12.5px/1.5 var(--mono); }
.tok { border: 1px solid var(--line); background: none; color: var(--muted); padding: 0 4px; border-radius: 3px; white-space: pre; }
.tok.in { color: var(--prefill); border-color: var(--prefill); }
.tok.out { color: var(--decode); border-color: var(--decode); }
.tok.future { opacity: .32; border-style: dashed; }
.tok.input { background: var(--prefill); border-color: var(--prefill); color: var(--on-accent); }
.tok.input.out { background: color-mix(in srgb, var(--decode) 25%, var(--panel)); border-color: var(--decode); color: var(--ink); font-weight: 700; }
.tok.now { background: var(--decode); border-color: var(--decode); color: var(--on-accent); }
.tok.pick { outline: 2px solid var(--ink); outline-offset: 1px; }
.tok.fold { border-style: dotted; color: var(--muted); }
.grid3 { display: grid; grid-template-columns: minmax(250px, 1fr) minmax(330px, 1.45fr); gap: 14px; }
.stack { display: grid; gap: 14px; align-content: start; min-width: 0; }
@media (max-width: 760px) { .grid3 { grid-template-columns: 1fr; } .flow { grid-template-columns: 1fr; } .flow .arrow { display: none; } }
.cand { display: grid; grid-template-columns: 100px 1fr 58px; gap: 8px; align-items: center; font: 13px var(--mono); font-variant-numeric: tabular-nums; }
.cand .name { white-space: pre; overflow: hidden; text-overflow: ellipsis; }
.track { background: var(--empty); height: 12px; border-radius: 2px; overflow: hidden; }
.track i { display: block; height: 100%; background: var(--muted); }
.cand.win .track i { background: var(--decode); }
.cand.win .name { font-weight: 700; }
.cand .v { text-align: right; }
.stat { font: 700 22px var(--mono); font-variant-numeric: tabular-nums; }
.scroll { overflow-x: auto; }
canvas { display: block; max-width: 100%; }
.heat { display: grid; grid-template-columns: 26px repeat(32, minmax(8px, 1fr)); gap: 1px; font: 9.5px var(--mono); color: var(--muted); min-width: 320px; }
.heat .c { height: 11px; background: var(--empty); }
.heat .lab { text-align: right; padding-right: 4px; line-height: 11px; }
.heat .h { text-align: center; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; gap: 5px; align-items: center; }
.legend i { width: 12px; height: 9px; display: inline-block; border-radius: 2px; }
.legend i.ramp { width: 56px; background: linear-gradient(90deg, color-mix(in srgb, var(--decode) 30%, var(--empty)), var(--decode)); }
.compare mark { background: none; color: var(--decode); font-weight: 700; border-bottom: 2px solid var(--decode); }
footer { font-size: 12.5px; color: var(--muted); max-width: 90ch; }
</style>
</head>

      </div>
    </div>
    <p class="muted" id="meta"></p>
  </header>

  <section class="panel" id="controls">
    <div class="bar">
      <button id="play" type="button"></button>
      <button id="prev" type="button" data-t="prev"></button>
      <button id="next" type="button" data-t="next"></button>
      <input id="range" type="range" min="0" value="0">

    <div class="bar split">
      <h2 data-t="tokens"></h2>
      <span class="legend">
        <span><i style="background:var(--prefill)"></i><span data-t="lPrompt"></span></span>
        <span><i style="background:var(--decode)"></i><span data-t="lOut"></span></span>
        <span id="tokHint" data-t="lClick"></span>

  <div class="grid3">
    <div class="stack">
      <section class="panel">

      <section class="panel">
        <div class="bar split">

          <span class="stat" id="kv"></span>

        <div class="scroll"><canvas id="kvc"></canvas></div>

      </section>
    </div>
    <section class="panel">
      <div class="bar split">
        <h2 id="routeTitle"></h2>

      </div>
      <div class="scroll"><div class="heat" id="heat"></div></div>
      <p class="muted" id="routeNote"></p>
    </section>
  </div>

  <section class="panel compare" id="compare">
    <h2 data-t="cmpTitle"></h2>
    <p id="ref"></p>
    <p id="fast"></p>
    <p class="muted" id="cmpNote"></p>
  </section>

  <footer id="foot"></footer>

function drawKV(used) {
  const canvas = $("kvc"), total = P + O - 1, w = Math.max(canvas.parentElement.clientWidth, 200), rowH = 5;

  g.fillStyle = css("--empty"); g.fillRect(0, 0, w, h);

  if (used > P) { g.fillStyle = css("--decode"); g.fillRect(cw * P, 0, cw * (used - P), h); }

  route.forEach((ids, l) => {
    cells[l].forEach(c => { c.style.background = empty; });
    ids.forEach((e, r) => { cells[l][e].style.background = `color-mix(in srgb, ${dec} ${100 - r * 10}%, ${empty})`; });
  });
  $("routeTitle").textContent = L.route(show(all[idx]).trim() || show(all[idx]));
  let note = L.routeNote;
  if (idx > 0) {
    const prev = D.routes[idx - 1]; let same = 0;
    route.forEach((ids, l) => { const s = new Set(prev[l]); ids.forEach(e => { if (s.has(e)) same++; }); });
    note += L.same((same / (C.layers * C.experts_per_token) * 100).toFixed(0));
  }
  $("routeNote").textContent = picked !== null && picked >= D.routes.length ? L.lastTok : note;
}

function go(f) { frame = Math.max(0, Math.min(O - 1, f)); render(); }
function stop() { clearInterval(timer); timer = null; $("play").textContent = L.play; }
$("play").onclick = () => {
  if (timer) return stop();
  if (frame === O - 1) frame = 0;
  picked = null; $("play").textContent = L.pause; render();
  timer = setInterval(() => { frame === O - 1 ? stop() : go(frame + 1); }, 700);
};
$("prev").onclick = () => { stop(); go(frame - 1); };
$("next").onclick = () => { stop(); go(frame + 1); };
$("range").oninput = e => { stop(); go(+e.target.value); };
$("lang").onclick = () => { lang = lang === "zh" ? "en" : "zh"; L = TEXT[lang]; renderStatic(); render(); };
addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return;
  if (e.key === "ArrowRight") { stop(); go(frame + 1); }
  if (e.key === "ArrowLeft") { stop(); go(frame - 1); }
});
addEventListener("resize", render);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", render);
new MutationObserver(render).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
renderStatic();
render();
</script>
</body>
